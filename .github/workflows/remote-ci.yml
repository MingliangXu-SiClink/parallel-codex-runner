name: Remote CI

on:
  pull_request:
    paths:
      - "src/parallel_codex_runner_core/remote/**"
      - "src/parallel_codex_runner_core/plugin_runtime.py"
      - "src/parallel_codex_runner_core/conversation_*.py"
      - "src/parallel_codex_runner_core/finalization.py"
      - "apps/**"
      - "remote/**"
      - "scripts/generate_conversation_protocol.py"
      - "tests/**"
      - ".github/workflows/remote-ci.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/parallel_codex_runner_core/remote/**"
      - "src/parallel_codex_runner_core/plugin_runtime.py"
      - "src/parallel_codex_runner_core/conversation_*.py"
      - "src/parallel_codex_runner_core/finalization.py"
      - "apps/**"
      - "remote/**"
      - "scripts/generate_conversation_protocol.py"
      - "tests/**"
      - ".github/workflows/remote-ci.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/generate_conversation_protocol.py --check
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: |
          python -m pip wheel --no-deps . --wheel-dir "${RUNNER_TEMP}/pcr-dist"
          python -m venv "${RUNNER_TEMP}/pcr-wheel-smoke"
          "${RUNNER_TEMP}/pcr-wheel-smoke/bin/pip" install "${RUNNER_TEMP}"/pcr-dist/*.whl
          "${RUNNER_TEMP}/pcr-wheel-smoke/bin/python" scripts/remote-smoke.py
      - run: python -m pip install -e remote/server
      - run: PYTHONPATH=remote/server python -m unittest discover -s remote/server/tests -p "test_*.py" -v
      - run: python -m pip wheel --no-deps remote/server --wheel-dir "${RUNNER_TEMP}/relay-dist"
      - run: python -m pip install --force-reinstall --no-deps "${RUNNER_TEMP}"/relay-dist/*.whl
      - run: pcr-relay-migrate
        env:
          PCR_RELAY_ENV: development
          PCR_RELAY_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/relay-migration.db
          PCR_RELAY_PUBLIC_BASE_URL: https://relay.test
          PCR_RELAY_JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
          PCR_RELAY_MAC_ENROLLMENT_TOKEN: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm
      - run: pcr-relay-admin users
        env:
          PCR_RELAY_ENV: development
          PCR_RELAY_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/relay-migration.db
          PCR_RELAY_PUBLIC_BASE_URL: https://relay.test
          PCR_RELAY_JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
          PCR_RELAY_MAC_ENROLLMENT_TOKEN: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: apps/android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd apps/android && ./gradlew :app:connectedDebugAndroidTest

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-client.sh
        working-directory: apps/macos
      - run: ./scripts/build-app.sh
        working-directory: apps/macos
      - run: codesign --verify --deep --strict --verbose=2 "dist/Parallel Codex.app"
        working-directory: apps/macos
      - run: ./scripts/test-installed-upgrade.sh
        working-directory: apps/macos
