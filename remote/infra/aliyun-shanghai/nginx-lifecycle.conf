[Service]
Type=forking
PIDFile=/www/server/nginx/logs/nginx.pid
GuessMainPID=no
RemainAfterExit=no
SuccessExitStatus=
Restart=no
ExecStartPre=
ExecStartPre=/www/server/nginx/sbin/nginx -t -q -c /www/server/nginx/conf/nginx.conf
ExecStart=
ExecStart=/www/server/nginx/sbin/nginx -c /www/server/nginx/conf/nginx.conf
ExecStop=
ExecReload=
ExecReload=/www/server/nginx/sbin/nginx -t -q -c /www/server/nginx/conf/nginx.conf
ExecReload=/bin/kill -HUP $MAINPID
KillMode=mixed
KillSignal=SIGQUIT
SendSIGKILL=no
TimeoutStopSec=5min
